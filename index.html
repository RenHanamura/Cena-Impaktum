<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cena de fin de año</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Figtree:wght@400;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #12332b;
      --panel: #1a4136;
      --line: #2f5f51;
      --ink: #f3eedc;
      --mute: #a9c1b4;
      --gold: #e3b23c;
      --bad: #ff8f7a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 Figtree, system-ui, sans-serif
    }

    h1,
    h2,
    h3 {
      font-family: Fraunces, Georgia, serif;
      margin: 0
    }

    .wrap {
      max-width: 960px;
      margin: auto;
      padding: 20px
    }

    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    nav button {
      background: none;
      border: 1px solid var(--line);
      color: var(--mute);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit
    }

    nav button.on {
      background: var(--gold);
      color: #12332b;
      border-color: var(--gold);
      font-weight: 600
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px
    }

    input,
    select,
    .b {
      font: inherit;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0f2a23;
      color: var(--ink)
    }

    .b {
      background: var(--gold);
      color: #12332b;
      font-weight: 600;
      cursor: pointer;
      border-color: var(--gold)
    }

    .b.alt {
      background: none;
      color: var(--ink);
      border-color: var(--line)
    }

    .b.on {
      outline: 2px solid var(--ink)
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    td,
    th {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line)
    }

    .mute {
      color: var(--mute)
    }

    .win {
      color: var(--gold);
      font-family: Fraunces, serif;
      font-size: 1.3rem
    }

    .qr {
      background: #f3eedc;
      padding: 10px;
      border-radius: 8px;
      display: inline-block
    }

    /* pantalla grande */
    .scr {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4vw;
      gap: 2vw
    }

    .scr h1 {
      font-size: clamp(2.4rem, 7vw, 6rem);
      font-weight: 800;
      letter-spacing: -.02em
    }

    .scr .big {
      font-family: Fraunces, serif;
      font-size: clamp(1.8rem, 5vw, 4rem);
      line-height: 1.15
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5vw;
      width: 100%;
      max-width: 1200px
    }

    .opt {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 1.4vw 2vw;
      font-size: clamp(1.1rem, 2.6vw, 2.2rem);
      text-align: left
    }

    .opt.ok {
      border-color: var(--gold);
      background: #2c5a3c
    }

    .opt i {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: rgba(227, 178, 60, .22)
    }

    .opt span {
      position: relative
    }

    .gold {
      color: var(--gold)
    }

    /* celular */
    .ph {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      min-height: 100vh
    }

    .ph .opt {
      width: 100%;
      display: block;
      margin: 10px 0;
      cursor: pointer;
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem
    }

    .ph .opt.sel {
      border-color: var(--gold);
      background: #2c5a3c
    }

    .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8vw;width:100%;max-width:1400px;text-align:left}
.bw{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5vw 1vw;font-size:clamp(1rem,1.7vw,1.5rem)}
.bw small{display:block;color:var(--mute);font-size:.7em}

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    #msg {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #12332b;
      padding: 10px 18px;
      border-radius: 8px;
      display: none;
      z-index: 9
    }
  </style>
</head>

<body>

  <script>
    // ============ CONFIGURACIÓN ============

    // ========================================

    async function q(p) { const r = await p; if (r.error) { toast(r.error.message); throw r.error; } return r.data; }
    const qr = (el, text, size) => { el.innerHTML = ""; new QRCode(el, { text, width: size, height: size, colorDark: "#12332b", colorLight: "#f3eedc" }); };

    // ---------- Datos + tiempo real ----------
    let last = "", dirty = false, prevPhase;
    async function load() {
      if (!sb) { $("app").innerHTML = `<div class="wrap card">Configura SUPABASE_URL y SUPABASE_ANON_KEY al inicio del archivo.</div>`; return; }
      const [people, dynamics, qs, ans, win, ent, gs, prizes] = await Promise.all(["participants", "dynamics", "questions", "answers", "winners", "entries", "game_state", "prizes"].map(t => q(sb.from(t).select("*"))));
Object.assign(S, { people: people.sort((a, b) => a.name.localeCompare(b.name)), dyn: dynamics.sort((a, b) => a.position - b.position), qs: qs.sort((a, b) => a.position - b.position), ans, win, ent, gs: gs[0] || {}, prizes: prizes.sort((a, b) => a.created_at.localeCompare(b.created_at)) });

    }
    const typing = () => V === "admin" && /INPUT|SELECT/.test(document.activeElement?.tagName) && document.activeElement.type !== "checkbox";
    document.addEventListener("focusout", () => setTimeout(() => { if (dirty && !typing()) { dirty = false; draw(); } }, 80));
    let t0; const soon = () => { clearTimeout(t0); t0 = setTimeout(load, 250); };
    function draw() { ({ admin, screen, play, board })[V]?.(); prevPhase = S.gs.phase; }
    function start() {
      if (V === "admin" && sessionStorage.ok !== "1") { if (prompt("PIN de administrador") !== ADMIN_PIN) { document.body.innerHTML = "<p style='padding:20px'>Acceso restringido.</p>"; return; } sessionStorage.ok = "1"; }
      load(); if (sb) { sb.channel("all").on("postgres_changes", { event: "*", schema: "public" }, soon).subscribe(); setInterval(load, 4000); }
    }

    // ---------- Lógica común ----------
    function weightedPick(list) {
      const total = list.reduce((a, p) => a + Number(p.multiplier), 0); let r = Math.random() * total;
      for (const p of list) { r -= Number(p.multiplier); if (r <= 0) return { p, prob: p.multiplier / total }; }
      return { p: list.at(-1), prob: 0 };
    }
    function scores(did) {
      const m = {}; S.ans.forEach(a => { const x = S.qs.find(x => x.id === a.question_id); if (x?.dynamic_id !== did) return; m[a.participant_id] = (m[a.participant_id] || 0) + (a.is_correct ? x.points : 0); });
      return Object.entries(m).map(([id, pts]) => ({ id, pts })).sort((a, b) => b.pts - a.pts);
    }
    const setGS = patch => q(sb.from("game_state").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1)).then(load);
  function pickMany(list, n) {
  const pool = [...list], out = [];
  while (out.length < n && pool.length) { const { p } = weightedPick(pool); out.push(p); pool.splice(pool.indexOf(p), 1); }
  return out;
}
const prizeSlots = did => S.prizes.filter(p => p.dynamic_id === did).flatMap(p => Array(p.quantity).fill(p.id));
async function saveWinners(did, people, method) {
  const slots = prizeSlots(did);
  const rows = people.map((p, i) => ({ dynamic_id: did, participant_id: p.id, rank: i + 1, prize_id: slots[i] || null, method, detail: { multiplier: p.multiplier } }));
  await q(sb.from("winners").delete().eq("dynamic_id", did));
  await q(sb.from("winners").insert(rows));
  await q(sb.from("dynamics").update({ status: "finished" }).eq("id", did));
}
const wonElsewhere = did => new Set(S.win.filter(w => w.dynamic_id !== did).map(w => w.participant_id));

    // =====================================================
    //  ADMIN
    // =====================================================
    let tab = "live", quizId;
    const TABS = [["live", "En vivo"], ["dyn", "Dinámicas"], ["qs", "Preguntas"], ["people", "Participantes"], ["prizes", "Premios"]];
    function admin() {
      quizId ??= S.dyn.find(d => d.type === "quiz")?.id;
      $("app").innerHTML = `<div class="wrap"><h2>Panel del organizador</h2>
  <div class="row"><a class="b" href="${link("screen")}" target="_blank">Abrir pantalla grande</a><span class="mute">Proyecta esa pestaña. Los celulares entran escaneando el QR.</span></div>
  <nav>${TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';draw()">${l}</button>`).join("")}</nav>
  <div id="pane"></div></div>`;
      ({ live: aLive, dyn: aDyn, qs: aQs, people: aPeople, prizes: aPrizes })[tab]();
    }
    function aLive() {
      const g = S.gs, d = dyn(g.dynamic_id);
      if (!d || g.phase === "idle") { $("pane").innerHTML = `<div class="card mute">No hay dinámica activa. Lánzala desde la pestaña Dinámicas.</div>`; return; }
      const joined = S.ent.filter(e => e.dynamic_id === d.id), ws = winnersOf(d.id);
      let body = "";
      if (d.type === "quiz") {
        const ql = S.qs.filter(x => x.dynamic_id === d.id);
        body = `<div class="card"><h3>Preguntas</h3>${ql.map((x, i) => `<div class="row"><button class="b ${g.question_id === x.id && g.phase === "question" ? "on" : "alt"}" onclick="setGS({question_id:'${x.id}',phase:'question'})">Lanzar</button> ${i + 1}. ${esc(x.text)} <span class="mute">${S.ans.filter(a => a.question_id === x.id).length} resp.</span></div>`).join("") || `<span class="mute">Sin preguntas.</span>`}
    <div class="row"><button class="b" onclick="setGS({phase:'reveal'})">Mostrar respuesta</button><button class="b" onclick="quizWinner('${d.id}')">Declarar ganador</button></div></div>
    <div class="card"><h3>Puntajes</h3><table>${scores(d.id).map(r => `<tr><td>${esc(who(r.id))}</td><td>${r.pts} pt</td></tr>`).join("") || "<tr><td class='mute'>Sin respuestas</td></tr>"}</table></div>`;
      } else {
        const tot = joined.reduce((a, e) => a + Number(S.people.find(p => p.id === e.participant_id)?.multiplier || 1), 0);
        body = `<div class="card"><div class="row"><button class="b" onclick="raffle('${d.id}')" ${ws.length ? "disabled" : ""}>Sortear</button></div>
    <table>${joined.map(e => { const p = S.people.find(p => p.id === e.participant_id); return p ? `<tr><td>${esc(p.name)}</td><td>x${p.multiplier}</td><td class="mute">${(p.multiplier / tot * 100).toFixed(1)}%</td></tr>` : ""; }).join("")}</table></div>`;
      }
      $("pane").innerHTML = `<div class="card"><h3>${esc(d.name)}</h3><div class="mute">Fase: ${g.phase} · ${joined.length} se han unido</div>${ws.length ? `<div class="win">🏆 ${ws.length} ganadores</div>` : ""}
  <div class="row"><button class="b alt" onclick="setGS({phase:'lobby'})">Volver al QR</button><button class="b alt" onclick="setGS({phase:'idle',dynamic_id:null,question_id:null})">Cerrar dinámica</button></div></div>${body}`;
    }
   async function quizWinner(did) {
  const n = dyn(did).winner_count || 25, won = wonElsewhere(did);
  const s = scores(did).filter(r => !won.has(r.id));
  if (!s.length) return toast("Sin respuestas");
  const cut = s[Math.min(n, s.length) - 1].pts, byId = r => S.people.find(p => p.id === r.id);
  const sure = s.filter(r => r.pts > cut).map(byId), tied = s.filter(r => r.pts === cut).map(byId);
  await saveWinners(did, [...sure, ...pickMany(tied, n - sure.length)].filter(Boolean), "quiz"); setGS({ phase: "winner" });
}
async function raffle(did) {
  const n = dyn(did).winner_count || 25, won = wonElsewhere(did);
  const pool = S.ent.filter(e => e.dynamic_id === did && !won.has(e.participant_id)).map(e => S.people.find(p => p.id === e.participant_id)).filter(Boolean);
  if (!pool.length) return toast("Nadie disponible para el sorteo");
  await saveWinners(did, pickMany(pool, n), "weighted_raffle"); setGS({ phase: "winner" });
}
    function aDyn() {
  $("pane").innerHTML = `<div class="grid">${S.dyn.map(d => {
    const ws = winnersOf(d.id); return `<div class="card"><h3>${d.position}. ${esc(d.name)}</h3>
    <div class="row"><input value="${esc(d.name)}" onchange="upd('${d.id}',{name:this.value})">
    <select onchange="upd('${d.id}',{type:this.value})"><option value="quiz" ${d.type === "quiz" ? "selected" : ""}>Cuestionario</option><option value="raffle" ${d.type === "raffle" ? "selected" : ""}>Sorteo</option></select>
    <input type="number" min="1" value="${d.winner_count}" style="width:80px" title="Ganadores" onchange="upd('${d.id}',{winner_count:+this.value})"></div>
    <div class="mute">${ws.length} de ${d.winner_count} ganadores</div>
    <div class="qr" id="qr-${d.id}"></div><div class="mute" style="word-break:break-all;font-size:.75rem">${link("play", d.id)}</div>
    <div class="row"><button class="b" onclick="launch('${d.id}')">Lanzar</button>${ws.length ? `<button class="b alt" onclick="resetW('${d.id}')">Reiniciar</button>` : ""}</div>
    ${ws.length ? `<div class="win">🏆 ${ws.length} ganadores</div>` : ""}</div>`;
  }).join("")}</div>`;
  S.dyn.forEach(d => qr($("qr-" + d.id), link("play", d.id), 140));
}
    const upd = (id, patch) => q(sb.from("dynamics").update(patch).eq("id", id)).then(load);
    const launch = async id => { await q(sb.from("dynamics").update({ status: "active" }).eq("id", id)); tab = "live"; setGS({ dynamic_id: id, question_id: null, phase: "lobby" }); };
    async function resetW(id) { if (confirm("¿Borrar ganador?")) { await q(sb.from("winners").delete().eq("dynamic_id", id)); upd(id, { status: "pending" }); } }
    function aQs() {
      const qd = S.dyn.filter(d => d.type === "quiz"); if (!qd.length) { $("pane").innerHTML = `<div class="card mute">Ninguna dinámica es cuestionario.</div>`; return; }
      const ql = S.qs.filter(x => x.dynamic_id === quizId);
      $("pane").innerHTML = `<select onchange="quizId=this.value;draw()">${qd.map(d => `<option value="${d.id}" ${d.id === quizId ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select>
  <div class="card"><h3>Nueva pregunta</h3><div class="row"><input id="qt" placeholder="Pregunta" style="flex:1 1 100%"></div>
  <div class="row">${[0, 1, 2, 3].map(i => `<input id="qo${i}" placeholder="Opción ${i + 1}">`).join("")}</div>
  <div class="row"><select id="qc">${[0, 1, 2, 3].map(i => `<option value="${i}">Opción correcta: ${i + 1}</option>`).join("")}</select><input id="qp" type="number" min="1" value="1" style="width:80px" title="Puntos"><button class="b" onclick="addQ()">Agregar</button></div></div>
  <div class="card">${ql.map((x, i) => `<div class="row">${i + 1}. ${esc(x.text)} <span class="mute">(${x.points} pt)</span><button class="b alt" onclick="delQ('${x.id}')">Quitar</button></div>`).join("") || `<span class="mute">Sin preguntas.</span>`}</div>`;
    }
    async function addQ() {
      const o = [0, 1, 2, 3].map(i => $("qo" + i).value.trim()).filter(Boolean), t = $("qt").value.trim(); if (!t || o.length < 2) return toast("Pregunta y mínimo 2 opciones");
      await q(sb.from("questions").insert({ dynamic_id: quizId, text: t, options: o, correct_index: +$("qc").value, points: +$("qp").value || 1, position: S.qs.length })); load();
    }
    const delQ = id => q(sb.from("questions").delete().eq("id", id)).then(load);
    function aPeople() {
      $("pane").innerHTML = `<div class="card"><div class="row"><input id="pn" placeholder="Nombre"><input id="py" type="number" min="0" placeholder="Años en la empresa" style="width:180px"><button class="b" onclick="addP()">Agregar</button></div>
  <div class="row"><button class="b alt" onclick="downloadParticipantTemplate()">Descargar formato</button><button class="b alt" onclick="$('csvFile').click()">Cargar CSV</button><input id="csvFile" type="file" accept=".csv,text/csv" style="display:none" onchange="importParticipantsCsv(this)"></div>
  <div class="mute">El archivo CSV debe tener las columnas Nombre y Años en la empresa. El multiplicador se calcula con la tabla multiplier_rules; también puedes editarlo.</div></div>
  <div class="card"><table><tr><th>Nombre</th><th>Años</th><th>Multiplicador</th><th></th></tr>${S.people.map(p => `<tr><td>${esc(p.name)}</td><td>${p.years_at_company}</td><td><input type="number" step="0.5" min="0" value="${p.multiplier}" style="width:80px" onchange="q(sb.from('participants').update({multiplier:+this.value}).eq('id','${p.id}')).then(load)"></td><td><button class="b alt" onclick="delP('${p.id}')">Quitar</button></td></tr>`).join("")}</table></div>`;
    }
    async function addP() { const n = $("pn").value.trim(); if (!n) return; await q(sb.from("participants").insert({ name: n, years_at_company: +$("py").value || 0 })); load(); }
    async function delP(id) { if (confirm("¿Quitar?")) { await q(sb.from("participants").delete().eq("id", id)); load(); } }
    function downloadParticipantTemplate() {
      const csv = "\uFEFFNombre,Años en la empresa\n";
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "participantes.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    function parseCsv(text) {
      text = text.replace(/^\uFEFF/, "");
      const firstLine = text.split(/\r\n|\n|\r/, 1)[0] || "";
      const commaCount = (firstLine.match(/,/g) || []).length;
      const semicolonCount = (firstLine.match(/;/g) || []).length;
      const delimiter = semicolonCount > commaCount ? ";" : ",";
      const rows = [];
      let row = [], field = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (quoted && text[i + 1] === '"') { field += '"'; i++; }
          else quoted = !quoted;
        } else if (char === delimiter && !quoted) {
          row.push(field.trim());
          field = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && text[i + 1] === "\n") i++;
          row.push(field.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }
      row.push(field.trim());
      if (row.some(value => value !== "")) rows.push(row);
      return rows;
    }
    async function importParticipantsCsv(input) {
      const file = input.files?.[0];
      if (!file) return;
      try {
        const rows = parseCsv(await file.text());
        if (rows.length < 2) return toast("El CSV no contiene participantes");
        const normalizeHeader = value => String(value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const headers = rows[0].map(normalizeHeader);
        const nameIndex = headers.findIndex(value => ["nombre", "name", "participante", "employee", "empleado"].includes(value));
        const yearsIndex = headers.findIndex(value => ["anos", "anios", "anos en la empresa", "anios en la empresa", "years", "years at company", "years_at_company"].includes(value));
        if (nameIndex < 0) return toast("No se encontró la columna Nombre");
        if (yearsIndex < 0) return toast("No se encontró la columna Años en la empresa");

        const existingNames = new Set(S.people.map(person => normalizeHeader(person.name)));
        const seenNames = new Set();
        const participants = [];
        let skipped = 0;
        rows.slice(1).forEach(row => {
          const name = (row[nameIndex] || "").trim();
          const yearsText = (row[yearsIndex] || "").trim();
          const years = yearsText === "" ? 0 : Number(yearsText.replace(",", "."));
          const key = normalizeHeader(name);
          if (!name || !Number.isFinite(years) || years < 0 || existingNames.has(key) || seenNames.has(key)) {
            skipped++;
            return;
          }
          seenNames.add(key);
          participants.push({ name, years_at_company: years });
        });
        if (!participants.length) return toast(skipped ? "No hay participantes nuevos para cargar" : "El CSV no contiene participantes");
        await q(sb.from("participants").insert(participants).select());
        await load();
        toast(`${participants.length} participante${participants.length === 1 ? "" : "s"} cargado${participants.length === 1 ? "" : "s"}${skipped ? ` · ${skipped} omitido${skipped === 1 ? "" : "s"}` : ""}`);
      } catch (error) {
        toast(error.message || "No se pudo leer el CSV");
      } finally {
        input.value = "";
      }
    }
// ---------- Premios ----------  
    function aPrizes() {
      const total = S.prizes.reduce((a, p) => a + p.quantity, 0);
      $("pane").innerHTML = `<div class="card"><h3>Nuevo premio</h3>
        <div class="row"><input id="zn" placeholder="Premio" style="flex:1"><input id="zq" type="number" min="0" value="1" style="width:100px" title="Cantidad">
        <select id="zd"><option value="">Sin dinámica</option>${S.dyn.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select>
        <button class="b" onclick="addPrize()">Agregar</button></div>
        <div class="mute">${S.prizes.length} premios · ${total} piezas en total</div></div>
      <div class="card"><table><tr><th>Premio</th><th>Cantidad</th><th>Dinámica</th><th></th></tr>
      ${S.prizes.map(p => `<tr>
        <td><input value="${esc(p.name)}" onchange="updPrize('${p.id}',{name:this.value})"></td>
        <td><input type="number" min="0" value="${p.quantity}" style="width:80px" onchange="updPrize('${p.id}',{quantity:+this.value})"></td>
        <td><select onchange="updPrize('${p.id}',{dynamic_id:this.value||null})"><option value="">Sin dinámica</option>${S.dyn.map(d => `<option value="${d.id}" ${d.id === p.dynamic_id ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></td>
        <td><button class="b alt" onclick="delPrize('${p.id}')">Quitar</button></td></tr>`).join("") || `<tr><td class="mute">Aún no hay premios.</td></tr>`}
      </table></div>`;
    }
    async function addPrize() {
      const n = $("zn").value.trim(); if (!n) return toast("Escribe el nombre del premio");
      await q(sb.from("prizes").insert({ name: n, quantity: +$("zq").value || 0, dynamic_id: $("zd").value || null })); load();
    }
    const updPrize = (id, patch) => q(sb.from("prizes").update(patch).eq("id", id)).then(load);
    async function delPrize(id) { if (confirm("¿Quitar premio?")) { await q(sb.from("prizes").delete().eq("id", id)); load(); } }

    // =====================================================
    //  PANTALLA GRANDE
    // =====================================================
    let spinning = false;
    function screen() {
      if (spinning) return;
      const g = S.gs, d = dyn(g.dynamic_id), ph = g.phase, x = S.qs.find(x => x.id === g.question_id), ws = d ? winnersOf(d.id) : [];
      let h = "";
      if (!d || ph === "idle") {
        h = `<h1>Cena de fin de año</h1><div class="big mute">${S.win.length} ganadores hasta ahora</div>
<div class="row" style="justify-content:center;gap:2vw">${S.dyn.filter(z => winnersOf(z.id).length).map(z => `<div class="card"><div class="mute">${esc(z.name)}</div><div class="win">🏆 ${winnersOf(z.id).length} ganadores</div></div>`).join("")}</div>`;
      } else if (ph === "lobby") {
        h = `<h1>${esc(d.name)}</h1>${d.prize ? `<div class="big gold">${esc(d.prize)}</div>` : ""}<div class="qr" id="qr"></div>
    <div class="big">Escanea para unirte</div><div class="mute" style="font-size:1.6rem">${S.ent.filter(e => e.dynamic_id === d.id).length} participantes dentro</div>`;
      } else if (ph === "question" && x) {
        const n = S.ans.filter(a => a.question_id === x.id).length, tot = S.ent.filter(e => e.dynamic_id === d.id).length;
        h = `<div class="mute" style="font-size:1.5rem">${esc(d.name)}</div><div class="big">${esc(x.text)}</div>
    <div class="opts">${x.options.map((o, i) => `<div class="opt"><span><b class="gold">${"ABCD"[i]}</b> ${esc(o)}</span></div>`).join("")}</div>
    <div class="mute" style="font-size:1.6rem">${n} de ${tot} han respondido</div>`;
      } else if (ph === "reveal" && x) {
        const c = x.options.map((_, i) => S.ans.filter(a => a.question_id === x.id && a.selected_index === i).length), mx = Math.max(1, ...c);
        h = `<div class="big">${esc(x.text)}</div><div class="opts">${x.options.map((o, i) => `<div class="opt ${i === x.correct_index ? "ok" : ""}"><i style="width:${c[i] / mx * 100}%"></i><span><b class="gold">${"ABCD"[i]}</b> ${esc(o)} · ${c[i]}</span></div>`).join("")}</div>
    <div class="mute" style="font-size:1.5rem">${scores(d.id).slice(0, 3).map(r => `${esc(who(r.id))} ${r.pts} pt`).join("  ·  ")}</div>`;
      } else if (ph === "winner" && ws.length) {
  if (d.type === "raffle" && prevPhase && prevPhase !== "winner") { spinAnim(d); return; }
  h = boardHTML(d);
} else h = `<h1>${esc(d?.name || "")}</h1>`;
      $("app").innerHTML = `<div class="scr">${h}</div>`;
      if (ph === "lobby") qr($("qr"), link("play", d.id), 320);
    }
    const cells = ws => ws.map((w, i) => `<div class="bw"><b class="gold">${i + 1}</b> ${esc(who(w.participant_id))}<small>${esc(S.prizes.find(p => p.id === w.prize_id)?.name || "")}</small></div>`).join("");
const boardHTML = d => `<div class="big gold">${esc(d.name)}</div><div class="board">${cells(winnersOf(d.id))}</div>`;
function board() {
  $("app").innerHTML = `<div class="wrap"><h1>Ganadores</h1>${S.dyn.map(d => { const ws = winnersOf(d.id); return ws.length ? `<div class="card"><h3>${esc(d.name)} · ${ws.length}</h3><div class="board">${cells(ws)}</div></div>` : ""; }).join("")}</div>`;
}
function spinAnim(d) {
  spinning = true; const pool = S.ent.filter(e => e.dynamic_id === d.id).map(e => who(e.participant_id)); let n = 0;
  $("app").innerHTML = `<div class="scr"><div class="big mute">${esc(d.name)}</div><h1 class="gold" id="sp"></h1></div>`;
  const t = setInterval(() => {
    if (++n > 30) { clearInterval(t); spinning = false; $("app").innerHTML = `<div class="scr">${boardHTML(d)}</div>`; return; }
    $("sp").textContent = pool[Math.floor(Math.random() * pool.length)] || "…";
  }, 100);
}

    // =====================================================
    //  CELULAR (público)
    // =====================================================
    let joining = false;
    function play() {
      const me = S.people.find(p => p.id === localStorage.me);
      if (!me) {
        $("app").innerHTML = `<div class="ph"><h2>¡Bienvenido!</h2><p class="mute">Elige tu nombre para participar.</p>
    <div class="row"><select id="who" style="flex:1"><option value="">Mi nombre…</option>${S.people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><button class="b" onclick="iAm()">Entrar</button></div>
    <div class="card"><b>¿No estás en la lista?</b><div class="row"><input id="rn" placeholder="Tu nombre" style="flex:1 1 100%"><input id="ry" type="number" min="0" placeholder="Años en la empresa" style="flex:1"><button class="b" onclick="register()">Registrarme</button></div></div></div>`;
        return;
      }
      const g = S.gs, d = dyn(D), x = S.qs.find(x => x.id === g.question_id), live = d && g.dynamic_id === D && g.phase !== "idle";
      let b;
      if (!d) b = `<p>Escanea el QR de la dinámica que aparece en la pantalla.</p>`;
     else if (!live) { b = winnersOf(D).length ? `<h3>${esc(d.name)}</h3><p>Esta dinámica ya terminó. ¡Gracias por jugar!</p>` : `<h3>${esc(d.name)}</h3><p class="mute">Todavía no empieza. Espera tu turno.</p>`; }
      else {
        if (!S.ent.some(e => e.dynamic_id === D && e.participant_id === me.id) && !joining) { joining = true; q(sb.from("entries").upsert({ dynamic_id: D, participant_id: me.id })).then(() => { joining = false; load(); }); }
        const ph = g.phase, a = x && S.ans.find(a => a.question_id === x.id && a.participant_id === me.id);
        if (ph === "lobby") b = `<h3>${esc(d.name)}</h3><p>✅ Ya estás dentro. Mira la pantalla.</p>`;
        else if (ph === "question" && x) b = `<h3>${esc(x.text)}</h3>${x.options.map((o, i) => `<button class="opt ${a?.selected_index === i ? "sel" : ""}" onclick="answer('${x.id}',${i})" ${a ? "disabled" : ""}>${"ABCD"[i]}. ${esc(o)}</button>`).join("")}${a ? `<p class="mute">Respuesta enviada. Espera el resultado.</p>` : ""}`;
        else if (ph === "reveal" && x) b = a ? `<h2>${a.is_correct ? "✅ ¡Correcto!" : "❌ Esta vez no"}</h2>` : `<p class="mute">No respondiste a tiempo.</p>`;
        else if (ph === "winner") { const mine = S.win.find(x => x.dynamic_id === D && x.participant_id === me.id); b = mine ? `<h2 class="gold">🏆 ¡Ganaste!</h2><p>${esc(S.prizes.find(p => p.id === mine.prize_id)?.name || "")}</p>` : `<p>Gracias por jugar. Esta vez no salió tu nombre, ¡sigue participando en las siguientes!</p>`; }
        else b = `<p class="mute">Mira la pantalla…</p>`;
      }
      $("app").innerHTML = `<div class="ph"><div class="mute">Hola, ${esc(me.name)} · <a href="#" style="color:var(--mute)" onclick="localStorage.removeItem('me');draw();return false">no soy yo</a></div>${b}</div>`;
    }
    function iAm() { const v = $("who").value; if (v) { localStorage.me = v; draw(); } }
    async function register() {
      const n = $("rn").value.trim(); if (!n) return toast("Escribe tu nombre");
      const r = await q(sb.from("participants").insert({ name: n, years_at_company: +$("ry").value || 0 }).select()); localStorage.me = r[0].id; load();
    }
    async function answer(qid, i) {
      const x = S.qs.find(a => a.id === qid);
      await q(sb.from("answers").upsert({ question_id: qid, participant_id: localStorage.me, selected_index: i, is_correct: i === x.correct_index }, { onConflict: "question_id,participant_id" })); load();
    }
    start();
  </script>
</body>
